name: Documentation
description: New pages or changes to existing
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Remember: Lazyvim is a community-driven project. If you want to help improve the documentation, please provide as much detail as possible.

  - type: textarea
    id: steps
    attributes:
      label: What correction or addition do we need?
    validations:
      required: true
